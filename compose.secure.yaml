name: esodm-secure
x-secure: &secure
  environment:
    discovery.type: single-node
    xpack.security.enabled: 'true'
    xpack.security.http.ssl.enabled: 'true'
    xpack.security.http.ssl.key: certs/server.key
    xpack.security.http.ssl.certificate: certs/server.crt
    ELASTIC_PASSWORD: ${ESODM_TEST_PASSWORD:?Run scripts/secure.py}
    ES_JAVA_OPTS: -Xms512m -Xmx512m
    cluster.routing.allocation.disk.watermark.low: 2gb
    cluster.routing.allocation.disk.watermark.high: 1gb
    cluster.routing.allocation.disk.watermark.flood_stage: 512mb
  volumes:
    - ./artifacts/secure/certs:/usr/share/elasticsearch/config/certs:ro
  mem_limit: 2g
  cpus: 2
  healthcheck:
    test: [CMD-SHELL, 'curl -s --cacert config/certs/server.crt https://localhost:9200 | grep -q security_exception']
    interval: 5s
    timeout: 5s
    retries: 36
services:
  es8-secure:
    <<: *secure
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.7@sha256:655d2801fa29bdb75c7d7862f32897f74b51ce5c7e0c1fa9ef3f5f40b07a8c88
    ports: ['127.0.0.1:19380:9200']
  es9-secure:
    <<: *secure
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2@sha256:9c1e1afc2bda921b35025e21c72ec6e392266995aa35ad6a47887363592718be
    ports: ['127.0.0.1:19390:9200']
