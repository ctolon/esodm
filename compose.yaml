name: esodm
x-es-environment: &es-environment
  discovery.type: single-node
  xpack.security.enabled: "false"
  xpack.license.self_generated.type: trial
  ES_JAVA_OPTS: -Xms512m -Xmx512m
  cluster.routing.allocation.disk.watermark.low: 2gb
  cluster.routing.allocation.disk.watermark.high: 1gb
  cluster.routing.allocation.disk.watermark.flood_stage: 512mb
x-es-common: &es-common
  environment: *es-environment
  mem_limit: 2g
  cpus: 2
  healthcheck:
    test: [CMD-SHELL, "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
    interval: 5s
    timeout: 10s
    retries: 30
services:
  es8:
    <<: *es-common
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.7@sha256:655d2801fa29bdb75c7d7862f32897f74b51ce5c7e0c1fa9ef3f5f40b07a8c88
    ports: ["127.0.0.1:19280:9200"]
  es9:
    <<: *es-common
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2@sha256:9c1e1afc2bda921b35025e21c72ec6e392266995aa35ad6a47887363592718be
    ports: ["127.0.0.1:19290:9200"]
  es8-baseline:
    <<: *es-common
    profiles: [matrix]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1@sha256:e0dd6421674d6b28224ca38cb9a19e79c1f365361e3e5b295cb87eca7ecfdad9
    ports: ["127.0.0.1:19281:9200"]
  es9-baseline:
    <<: *es-common
    profiles: [matrix]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5@sha256:b146294881f6bf3961a1d9e952ad5751f68fe0cc816d7e9b8ebf4891fddd9d05
    ports: ["127.0.0.1:19291:9200"]
